name: Refresh videos
on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/update_videos.py
      - name: Commit if the video list changed
        run: |
          if git diff --quiet; then echo "no change"; exit 0; fi
          git config user.name "Signal & Byte bot"
          git config user.email "hello@signalandbyte.com"
          git commit -am "Refresh video list"
          git push
